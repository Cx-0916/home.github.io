        function postMessageToTemplate(message) {
            if (!myFrame || !myFrame.contentWindow) return;
            myFrame.contentWindow.postMessage(message, TEMPLATE_IFRAME_ORIGIN);
        }

        function isMessageFromTemplate(event) {
            return !!(
                myFrame &&
                myFrame.contentWindow &&
                event.source === myFrame.contentWindow &&
                event.origin === TEMPLATE_IFRAME_ORIGIN
            );
        }

        function getNestedValue(obj, path) {
            try {
                return path.split('.').reduce((acc, key) => acc && acc[key], obj);
            } catch (e) {
                return undefined;
            }
        }

        function firstNotEmpty(list) {
            for (let i = 0; i < list.length; i++) {
                const v = list[i];
                if (v !== undefined && v !== null && String(v).trim() !== '') {
                    return v;
                }
            }
            return '';
        }

        function isDemoMode() {
            return location.search.indexOf('is_demo=1') > -1;
        }

        function isCleanMode() {
            return location.search.indexOf('clean=1') > -1 ||
                location.search.indexOf('displayMode=clean') > -1 ||
                location.search.indexOf('display_mode=clean') > -1 ||
                location.search.indexOf('mode=clean') > -1;
        }

        function shouldHideButtons() {
            return isCleanMode() ||
                isDemoMode() ||
                location.search.indexOf('hide_btns=1') > -1 ||
                location.search.indexOf('hideBtns=1') > -1;
        }

        function resolveMusicUrl(td) {
            return firstNotEmpty([
                td.music_url,
                td.music,
                getNestedValue(td, 'data.music_url'),
                getNestedValue(td, 'data.music'),
                getNestedValue(td, 'cate.music_url'),
                getNestedValue(td, 'cate.music_url_dy'),
                getNestedValue(td, 'data.cate.music_url'),
                getNestedValue(td, 'data.cate.music_url_dy')
            ]);
        }

        function isSameMediaUrl(a, b) {
            const normalize = function (value) {
                return String(value || '').replace(/[?#].*$/, '');
            };
            return !!normalize(a) && normalize(a) === normalize(b);
        }

        function getUsableInnerMediaUrl(player) {
            if (!player) return '';

            let value = '';
            try {
                value = player.currentSrc
                    || (player.getAttribute && player.getAttribute('src'))
                    || player.src
                    || '';
                if (!value && player.querySelector) {
                    const source = player.querySelector('source[src]');
                    value = source ? (source.getAttribute('src') || source.src || '') : '';
                }
            } catch (e) {
                return '';
            }

            value = String(value || '').trim();
            if (!value || /(?:^|\/)(?:undefined|null)(?:[?#]|$)/i.test(value)) {
                return '';
            }
            return value;
        }

        function isBarrage3dTemplate() {
            try {
                return String(getNestedValue(getSafeTemplateData(), 'templateInfo.path') || '') === 'template/barrage/3d';
            } catch (e) {
                return false;
            }
        }

        function initIframe() {
            if (iframeInited) return;

            const td = getSafeTemplateData();

            if (myFrame && td && td.templateInfo && td.templateInfo.path) {
                const path = td.templateInfo.path;
                const versionId = String(td.versionId || Date.now()) +
                    (path === 'template/love/aixin/3d' ? '-no-third-party-v2' : '') +
                    (path === 'template/barrage/3d' ? '-scene-ready-v1' : '') +
                    (path === 'template/action/emoji' ? '-audio-single-v1' : '');
                const iframeUrl = new URL(TEMPLATE_IFRAME_HOST + '/' + path + '/index.html');
                iframeUrl.searchParams.set('v', versionId);
                if (path === 'template/barrage/3d' && td.content) {
                    iframeUrl.searchParams.set('content', String(td.content));
                }
                if (isDemoMode()) {
                    iframeUrl.searchParams.set('is_demo', '1');
                }
                if (shouldHideButtons()) {
                    iframeUrl.searchParams.set('hide_btns', '1');
                }
                myFrame.src = iframeUrl.toString();
                iframeInited = true;
            }
        }

        function syncTemplateDataToStorage() {
            try {
                localStorage.setItem('templateDate', JSON.stringify(window.templateData || {}));
            } catch (e) { }
        }

        function initOuterMusic() {
            outerMusicUrl = resolveMusicUrl(getSafeTemplateData());
            if (!outerMusicUrl && music) {
                music.removeAttribute('src');
                music.src = '';
                try { music.load(); } catch (e) { }
            }
            updateMusicBtnState();
        }

        function updateMusicBtnState() {
            if (!musicBtn || !music) return;
            musicBtn.classList.toggle('playing', !music.paused);
        }

        function safePlayOuterMusic() {
            if (innerPrimaryMediaActive || !music || !outerMusicUrl) return;

            const retryPlayOnce = function () {
                if (innerPrimaryMediaActive) return;
                try {
                    const retry = music.play();
                    if (retry && typeof retry.catch === 'function') {
                        retry.catch(function () { });
                    }
                } catch (e) { }
                updateMusicBtnState();
            };

            try {
                if (music.src !== outerMusicUrl) {
                    music.src = outerMusicUrl;
                    try { music.load(); } catch (e) { }
                }
                music.volume = 1;
                music.loop = true;
                const p = music.play();
                if (p && typeof p.catch === 'function') {
                    p.catch(function () {
                        try {
                            music.addEventListener('canplay', retryPlayOnce, { once: true });
                            music.load();
                        } catch (e) { }
                    });
                }
            } catch (e) { }
            updateMusicBtnState();
        }

        function safePauseOuterMusic() {
            if (!music) return;
            try { music.pause(); } catch (e) { }
            updateMusicBtnState();
        }

        function isInnerPrimaryMedia(player) {
            if (!player || !player.tagName) return false;
            const tagName = String(player.tagName).toLowerCase();
            const mediaUrl = getUsableInnerMediaUrl(player);
            if ((tagName === 'audio' || tagName === 'video') && !mediaUrl) {
                return false;
            }
            // 模板可能用一次性 audio 播放与外层相同的歌曲，也必须暂停外层播放器。
            if (tagName === 'audio' && isSameMediaUrl(mediaUrl, outerMusicUrl)) {
                return true;
            }
            const hint = [
                player.id,
                player.className,
                player.getAttribute && player.getAttribute('name'),
                player.getAttribute && player.getAttribute('data-role'),
                player.getAttribute && player.getAttribute('aria-label')
            ].map(function (value) { return String(value || ''); }).join(' ').toLowerCase();
            const looksLikeMusic = /(^|[^a-z0-9])(bgm|music|soundtrack|background[-_ ]?(music|audio))([^a-z0-9]|$)/.test(hint);

            if (tagName === 'audio') return !!player.loop || looksLikeMusic;
            if (tagName === 'video') return !player.muted && looksLikeMusic;
            return false;
        }

        function refreshInnerPrimaryMediaState() {
            innerPrimaryMediaPlayers.forEach(function (player) {
                try {
                    if (!player || !player.isConnected || player.paused || player.ended) {
                        innerPrimaryMediaPlayers.delete(player);
                    }
                } catch (e) {
                    innerPrimaryMediaPlayers.delete(player);
                }
            });
            innerPrimaryMediaActive = innerPrimaryMediaPlayers.size > 0;
        }

        function bindIframePrimaryMediaGuard() {
            if (!myFrame) return;

            let frameDocument = null;
            try {
                frameDocument = myFrame.contentDocument || (myFrame.contentWindow && myFrame.contentWindow.document);
            } catch (e) {
                return;
            }
            if (!frameDocument || frameDocument.__primaryMediaGuardBound) return;
            frameDocument.__primaryMediaGuardBound = true;
            innerPrimaryMediaPlayers.clear();
            innerPrimaryMediaActive = false;

            const handlePlay = function (event) {
                const player = event && event.target;
                if (!isInnerPrimaryMedia(player)) return;
                innerPrimaryMediaPlayers.add(player);
                innerPrimaryMediaActive = true;
                safePauseOuterMusic();
            };
            const handleStop = function (event) {
                const player = event && event.target;
                if (!player || (!innerPrimaryMediaPlayers.has(player) && !isInnerPrimaryMedia(player))) return;
                const wasActive = innerPrimaryMediaPlayers.has(player);
                innerPrimaryMediaPlayers.delete(player);
                refreshInnerPrimaryMediaState();
                if (wasActive && !innerPrimaryMediaActive && outerMusicUrl) {
                    safePlayOuterMusic();
                }
            };

            frameDocument.addEventListener('play', handlePlay, true);
            frameDocument.addEventListener('pause', handleStop, true);
            frameDocument.addEventListener('ended', handleStop, true);
            frameDocument.addEventListener('emptied', handleStop, true);
            frameDocument.addEventListener('error', handleStop, true);
            frameDocument.addEventListener('abort', handleStop, true);

            try {
                frameDocument.querySelectorAll('audio,video').forEach(function (player) {
                    if (isInnerPrimaryMedia(player) && !player.paused && !player.ended) {
                        handlePlay({ target: player });
                    }
                });
            } catch (e) { }
        }

        function stopOuterPlayback() {
            safePauseOuterMusic();
            try {
                document.querySelectorAll('audio,video').forEach(function (el) {
                    try { el.pause(); } catch (e) { }
                });
            } catch (e) { }
            try {
                if (myFrame && myFrame.contentWindow) {
                    postMessageToTemplate('pauseMusic');
                    postMessageToTemplate('innerPauseMusic');
                    postMessageToTemplate({ type: 'pauseMusic' });
                    postMessageToTemplate({ type: 'innerPauseMusic' });
                }
            } catch (e) { }
        }

        function finishOpenAction() {
            if (openActionCompleted) return;
            openActionCompleted = true;
            barrage3dOpenPending = false;
            if (barrage3dOpenFallbackTimer) {
                clearTimeout(barrage3dOpenFallbackTimer);
                barrage3dOpenFallbackTimer = null;
            }

            const openBox = document.querySelector('.open-box');

            if (openBox) {
                openBox.style.pointerEvents = 'none';
                openBox.style.transition = 'opacity .28s ease';
                openBox.style.opacity = '0';
                setTimeout(function () {
                    openBox.style.display = 'none';
                    openBox.style.visibility = 'hidden';
                }, 300);
            }

            safePlayOuterMusic();

            setTimeout(() => {
                if (myFrame && myFrame.contentWindow) {
                    try {
                        postMessageToTemplate('triggerOpen');
                        postMessageToTemplate({ type: 'triggerOpen' });
                    } catch (e) { }
                }
            }, 120);
        }

        function triggerOpenAction() {
            if (openActionCompleted || barrage3dOpenPending) return;

            // 用户点击后才真正加载祝福模板（iframe 初始为空，防止未点击就出现祝福语）
            if (myFrame && !myFrame.getAttribute('src') && myFrame.dataset.eagerSrc) {
                myFrame.src = myFrame.dataset.eagerSrc;
            }

            // Start audio inside the actual user gesture. The visual cover may remain briefly
            // while the 3D model and font finish preparing behind it.
            safePlayOuterMusic();

            if (isBarrage3dTemplate() && !barrage3dReady) {
                postMessageToTemplate({ type: 'barrage3dReadyRequest' });
                barrage3dOpenPending = true;
                const openBox = document.querySelector('.open-box');
                if (openBox) {
                    openBox.style.pointerEvents = 'none';
                    const message = openBox.querySelector('p');
                    if (message) message.textContent = '正在打开，请稍候…';
                }
                barrage3dOpenFallbackTimer = setTimeout(finishOpenAction, 8000);
                return;
            }

            finishOpenAction();
        }

        function bindOpenBtn() {
            const openBtn = document.getElementById('openBtn');
            const openBox = document.querySelector('.open-box');

            if (openBtn) {
                const handleUserOpen = function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    triggerOpenAction();
                };

                openBtn.addEventListener('click', handleUserOpen, true);
                openBtn.addEventListener('touchstart', handleUserOpen, { passive: false, capture: true });
                openBtn.addEventListener('touchend', handleUserOpen, { passive: false, capture: true });
            }

            if (openBox) {
                openBox.addEventListener('click', function (e) {
                    if (e.target === openBox) {
                        e.preventDefault();
                        e.stopPropagation();
                        triggerOpenAction();
                    }
                });
            }

            document.addEventListener('click', function (e) {
                const btn = e.target && e.target.closest ? e.target.closest('#openBtn') : null;
                if (btn) {
                    e.preventDefault();
                    e.stopPropagation();
                    triggerOpenAction();
                }
            });
        }

        function bindMusicBtn() {
            if (!musicBtn || !music) return;

            musicBtn.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();

                if (!outerMusicUrl) return;

                if (music.paused) {
                    safePlayOuterMusic();
                } else {
                    safePauseOuterMusic();
                }
            });

            music.addEventListener('play', updateMusicBtnState);
            music.addEventListener('pause', updateMusicBtnState);
            music.addEventListener('ended', updateMusicBtnState);
        }

        function postTemplateDataToIframe() {
            if (!myFrame || !myFrame.contentWindow) return;
            try {
                postMessageToTemplate({
                    type: 'templateData',
                    data: window.templateData || {}
                });
            } catch (e) { }
        }

        function bindIframeLoad() {
            if (!myFrame) return;

            myFrame.addEventListener('load', function () {
                bindIframePrimaryMediaGuard();
                syncTemplateDataToStorage();
                postTemplateDataToIframe();
                if (isBarrage3dTemplate()) {
                    postMessageToTemplate({ type: 'barrage3dReadyRequest' });
                }
            });
            setTimeout(bindIframePrimaryMediaGuard, 0);
            setTimeout(bindIframePrimaryMediaGuard, 500);
        }

        function bindMessageBridge() {
            window.addEventListener('message', function (event) {
                if (!isMessageFromTemplate(event)) return;
                const msg = event.data;
                if (!msg) return;

                if (typeof msg === 'object') {
                    if (msg.type === 'barrage3dReady') {
                        barrage3dReady = true;
                        if (barrage3dOpenPending) finishOpenAction();
                        return;
                    }

                    const requestedMusic = firstNotEmpty([
                        msg.music,
                        msg.musicUrl,
                        msg.music_url
                    ]);
                    if (requestedMusic) {
                        outerMusicUrl = String(requestedMusic).trim();
                    }

                }

                if (msg === 'requestTemplateData') {
                    postTemplateDataToIframe();
                    return;
                }

                if (
                    msg === 'triggerOpen' ||
                    msg === 'innerUserOpenPlayMusic' ||
                    msg === 'innerAutoPlayMusic' ||
                    msg === 'retryOuterMusic' ||
                    msg === 'playOuterMusic'
                ) {
                    safePlayOuterMusic();
                    return;
                }

                if (typeof msg === 'object') {
                    if (msg.type === 'requestTemplateData') {
                        postTemplateDataToIframe();
                        return;
                    }

                    if (
                        msg.type === 'triggerOpen' ||
                        msg.type === 'innerUserOpenPlayMusic' ||
                        msg.type === 'innerAutoPlayMusic' ||
                        msg.type === 'showBtn' ||
                        msg.type === 'retryOuterMusic' ||
                        msg.type === 'playOuterMusic'
                    ) {
                        safePlayOuterMusic();
                        try {
                            if (typeof WeixinJSBridge !== 'undefined') {
                                WeixinJSBridge.invoke('getNetworkType', {}, safePlayOuterMusic);
                            }
                        } catch (e) { }
                        return;
                    }

                    if (msg.type === 'syncStorage') {
                        syncTemplateDataToStorage();
                        return;
                    }
                }
            });
            if (isBarrage3dTemplate()) {
                postMessageToTemplate({ type: 'barrage3dReadyRequest' });
            }
        }

        function bindPlaybackLifecycle() {
            if (music) {
                music.addEventListener('play', function () {
                    if (innerPrimaryMediaActive) {
                        try { music.pause(); } catch (e) { }
                        updateMusicBtnState();
                    }
                });
            }

            window.addEventListener('pagehide', function () {
                stopOuterPlayback();
            });
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    stopOuterPlayback();
                }
            });
        }

        function isOuterMusicPlaying() {
            return !!(music && !music.paused && !music.ended);
        }

        function isOuterOpenPending() {
            const openBox = document.querySelector('.open-box');
            if (!openBox) return false;
            const style = window.getComputedStyle(openBox);
            return style.display !== 'none'
                && style.visibility !== 'hidden'
                && Number(style.opacity || 1) !== 0;
        }

        function tryForceOuterAutoPlay() {
            if (innerPrimaryMediaActive) return;
            if (isOuterOpenPending()) return;
            if (!outerMusicUrl) return;
            if (isOuterMusicPlaying()) return;
            safePlayOuterMusic();
        }

        function bindWeChatForceAutoPlay() {
            const run = function () {
                tryForceOuterAutoPlay();
                setTimeout(function () {
                    if (!isOuterMusicPlaying()) tryForceOuterAutoPlay();
                }, 500);
            };

            try {
                if (typeof wx !== 'undefined' && wx.ready) {
                    wx.ready(run);
                }
            } catch (e) { }

            try {
                if (typeof WeixinJSBridge !== 'undefined') {
                    WeixinJSBridge.invoke('getNetworkType', {}, run);
                } else {
                    document.addEventListener('WeixinJSBridgeReady', function () {
                        try {
                            WeixinJSBridge.invoke('getNetworkType', {}, run);
                        } catch (e) {
                            run();
                        }
                    }, false);
                }
            } catch (e) { }

            window.addEventListener('pageshow', run);
            setTimeout(run, 100);
            setTimeout(run, 500);
            setTimeout(run, 1500);
        }

        document.addEventListener('DOMContentLoaded', function () {
            syncTemplateDataToStorage();
            initOuterMusic();
            bindIframeLoad();
            bindMessageBridge();
            bindPlaybackLifecycle();
            initIframe();
            bindOpenBtn();
            bindMusicBtn();
            bindWeChatForceAutoPlay();

            // 兜底保护：用户点击前，任何脚本都不得隐藏/淡出封面
            // （外部模板脚本可能因 autoplay 配置提前淡出，导致祝福语提前露出）
            setInterval(function () {
                if (openActionCompleted || barrage3dOpenPending) return;
                const ob = document.getElementById('openBtn');
                if (!ob) return;
                const cs = window.getComputedStyle(ob);
                if (cs.display === 'none' || cs.visibility === 'hidden' || Number(cs.opacity || 1) === 0) {
                    ob.style.display = '';
                    ob.style.visibility = '';
                    ob.style.opacity = '';
                    ob.style.transition = '';
                    ob.style.pointerEvents = '';
                }
            }, 500);
        });
    </script>

</body>

</html>
