<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愈兴 - 幽灵行者定制刀</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 游戏主题变量 - 现代化色彩系统 */
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --ghostrunner-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --success-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);

            --bg-color: #f8fafc;
            --bg-dark: #0f172a;
            --bg-card: rgba(255, 255, 255, 0.9);
            --bg-card-dark: rgba(30, 41, 59, 0.8);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --text-white: #ffffff;
            --text-glow: rgba(102, 126, 234, 0.5);

            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --shadow-glow: 0 0 20px rgba(102, 126, 234, 0.3);
            --shadow-elevated: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 动态背景效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(118, 75, 162, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(240, 147, 251, 0.1) 0%, transparent 50%);
            z-index: -1;
            transition: all 0.4s ease;
        }

        /* 深色主题 */
        body.dark-mode {
            --bg-color: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.8);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-glow: rgba(102, 126, 234, 0.8);
        }

        body.dark-mode::before {
            background:
                radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(118, 75, 162, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(240, 147, 251, 0.2) 0%, transparent 50%);
        }

        /* 现代化导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid transparent;
            background: var(--primary-gradient);
            padding: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }

        .avatar:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.8);
        }

        .navbar .nickname {
            font-size: 1.8rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            white-space: nowrap;
            text-shadow: 0 0 10px var(--text-glow);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-white);
            background: var(--primary-gradient);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .nav-links a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .nav-links a:hover::before {
            left: 100%;
        }

        .nav-links a:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .nav-links a.douyin-link {
            background: linear-gradient(135deg, #000000 0%, #333333 100%);
        }

        .nav-links a.douyin-link:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .nav-links a.active {
            background: var(--secondary-gradient);
        }

        /* 主题切换按钮 */
        .theme-toggle {
            background: var(--primary-gradient);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 12px;
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(180deg);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        /* 内容容器 */
        .main-container {
            padding-top: 120px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content {
            text-align: center;
            max-width: 700px;
            padding: 40px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: var(--shadow-elevated);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .content h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            text-shadow: 0 0 20px var(--text-glow);
            line-height: 1.3;
        }

        .content p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .highlight {
            color: #ea1203;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(234, 18, 3, 0.5);
        }

        /* 联系方式卡片 */
        .contact-section {
            margin: 30px 0;
        }

        .contact-links {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 30px 0;
        }

        .contact-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 18px 30px;
            background: var(--accent-gradient);
            color: white;
            text-decoration: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.3);
            cursor: pointer;
        }

        .contact-link:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(79, 172, 254, 0.5);
        }

        .contact-link.qq {
            background: linear-gradient(135deg, #12b7f5 0%, #0084ff 100%);
        }

        .contact-link.wx {
            background: linear-gradient(135deg, #07c160 0%, #00a862 100%);
        }

        /* 抖音按钮 */
        .douyin-section {
            margin: 30px 0;
        }

        .douyin-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .douyin-id {
            font-size: 1.2rem;
            font-weight: 700;
            color: #000;
            padding: 12px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .douyin-id:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .douyin-btn {
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #000 0%, #333 100%);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .douyin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
        }

        /* 复制提示框 */
        .copy-toast {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(-30px);
            background: var(--success-gradient);
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1001;
            box-shadow: 0 10px 30px rgba(67, 233, 123, 0.4);
        }

        .copy-toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .copy-toast.error {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
        }

        /* 手机访问提示 */
        .mobile-tip {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            color: var(--text-secondary);
            text-align: center;
            padding: 15px 20px;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 999;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .navbar {
                height: auto;
                min-height: 70px;
                padding: 15px 15px;
                flex-direction: column;
                gap: 10px;
            }

            .logo-container {
                gap: 10px;
            }

            .avatar {
                width: 40px;
                height: 40px;
            }

            .navbar .nickname {
                font-size: 1.4rem;
            }

            .nav-links {
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-links a {
                padding: 8px 14px;
                font-size: 0.85rem;
                white-space: nowrap;
            }

            .main-container {
                padding-top: 140px;
                padding-left: 15px;
                padding-right: 15px;
            }

            .content {
                padding: 25px 15px;
            }

            .content h1 {
                font-size: 1.8rem;
                text-align: center;
            }

            .content p {
                font-size: 0.95rem;
                text-align: center;
                line-height: 1.6;
            }

            .contact-links {
                flex-direction: column;
                gap: 12px;
            }

            .contact-link {
                width: 100%;
                max-width: 300px;
                margin: 0 auto;
            }

            .mobile-tip {
                display: block;
                font-size: 0.85rem;
            }

            .copy-toast {
                top: 150px;
                padding: 12px 20px;
                font-size: 0.9rem;
                left: 50%;
                transform: translateX(-50%);
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 12px 10px;
            }

            .navbar .nickname {
                font-size: 1.2rem;
            }

            .nav-links {
                gap: 6px;
            }

            .nav-links a {
                padding: 6px 10px;
                font-size: 0.8rem;
            }

            .main-container {
                padding-top: 130px;
            }

            .content h1 {
                font-size: 1.6rem;
            }

            .content p {
                font-size: 0.9rem;
            }

            .contact-link {
                padding: 15px 20px;
                font-size: 0.9rem;
            }
        }

        /* 小屏幕设备额外优化 */
        @media (max-width: 360px) {
            .navbar .nickname {
                font-size: 1.1rem;
            }

            .nav-links a {
                font-size: 0.75rem;
                padding: 5px 8px;
            }

            .content h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="logo-container">
            <img src="抖音头像.jpg" alt="跑杀2的头像" class="avatar">
            <a href="index.html" class="nickname">愈兴.</a>
        </div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div class="nav-links">
                <a href="index.html" class="active">首页</a>
                <a href="./声明/index.html">声明</a>
                <a href="zq.html">节日祝福</a>
                <a href="https://v.douyin.com/xvmtN621cWQ/" target="_blank" class="douyin-link">抖音主页</a>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
        </div>
    </nav>

    <!-- 复制提示框 -->
    <div class="copy-toast" id="copyToast">复制成功！</div>

    <!-- 主要内容区域 -->
    <div class="main-container">
        <div class="content">
            <h1>幽灵行者1定制</h1>
            <p>欢迎来到<span class="highlight">愈兴.</span>的个人网站！<br>本网站是关于制作<span class="highlight">幽灵行者1</span>定制刀的，需要<span
                    class="highlight">默认秋霜刻字</span>添加我即可！<br>点击下方联系方式即可复制添加，开始您的定制之旅！</p>

            <div class="contact-section">
                <div class="contact-links">
                    <span class="contact-link qq" data-copy="2679928465">
                        <span>💬</span>
                        QQ: 2679928465
                    </span>
                    <span class="contact-link wx" data-copy="18170378345">
                        <span>📱</span>
                        WX: 18170378345
                    </span>
                </div>
            </div>
        </div>
    </div>

    <!-- 手机访问提示 -->
    <div class="mobile-tip">
        🖥️ 建议使用电脑访问，获得更完整的定制体验
    </div>

    <script>
        // 主题切换功能
        const themeToggle = document.getElementById('themeToggle');
        const htmlBody = document.body;

        // 检查本地存储中的主题设置
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            htmlBody.classList.add('dark-mode');
            themeToggle.textContent = '☀️';
        }

        themeToggle.addEventListener('click', () => {
            const isDark = htmlBody.classList.toggle('dark-mode');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // 复制功能封装
        function copyToClipboard(text, successMsg, errorMsg) {
            navigator.clipboard.writeText(text)
                .then(() => {
                    const toast = document.getElementById('copyToast');
                    toast.textContent = successMsg;
                    toast.className = 'copy-toast show';
                    setTimeout(() => toast.classList.remove('show'), 3000);
                })
                .catch(err => {
                    console.error('复制失败:', err);
                    const toast = document.getElementById('copyToast');
                    toast.textContent = errorMsg;
                    toast.className = 'copy-toast error show';
                    setTimeout(() => toast.classList.remove('show'), 3000);
                });
        }

        // 绑定联系方式复制事件
        document.querySelectorAll('.contact-link').forEach(link => {
            link.addEventListener('click', function () {
                const copyText = this.getAttribute('data-copy');
                const type = this.classList.contains('qq') ? 'QQ' : '微信';
                copyToClipboard(copyText, `${type}已复制！`, `复制失败，请手动复制${type}！`);
            });
        });
    </script>
</body>

</html>
