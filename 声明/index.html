<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愈兴 - 幽灵行者定制刀 | 声明</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 游戏主题变量 - 现代化色彩系统 */
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --ghostrunner-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --success-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);

            --bg-color: #f8fafc;
            --bg-dark: #0f172a;
            --bg-card: rgba(255, 255, 255, 0.9);
            --bg-card-dark: rgba(30, 41, 59, 0.8);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --text-white: #ffffff;
            --text-glow: rgba(102, 126, 234, 0.5);

            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --shadow-glow: 0 0 20px rgba(102, 126, 234, 0.3);
            --shadow-elevated: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 动态背景效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(118, 75, 162, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(240, 147, 251, 0.1) 0%, transparent 50%);
            z-index: -1;
            transition: all 0.4s ease;
        }

        /* 深色主题 */
        body.dark-mode {
            --bg-color: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.8);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-glow: rgba(102, 126, 234, 0.8);
        }

        body.dark-mode::before {
            background:
                radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(118, 75, 162, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(240, 147, 251, 0.2) 0%, transparent 50%);
        }

        /* 现代化导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid transparent;
            background: var(--primary-gradient);
            padding: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }

        .avatar:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.8);
        }

        .navbar .nickname {
            font-size: 1.8rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            white-space: nowrap;
            text-shadow: 0 0 10px var(--text-glow);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-white);
            background: var(--primary-gradient);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .nav-links a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .nav-links a:hover::before {
            left: 100%;
        }

        .nav-links a:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .nav-links a.douyin-link {
            background: linear-gradient(135deg, #000000 0%, #333333 100%);
        }

        .nav-links a.douyin-link:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .nav-links a.active {
            background: var(--secondary-gradient);
        }

        /* 主题切换按钮 */
        .theme-toggle {
            background: var(--primary-gradient);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 12px;
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(180deg);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        /* 内容容器 */
        .main-container {
            padding-top: 120px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content {
            text-align: center;
            max-width: 700px;
            padding: 40px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: var(--shadow-elevated);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .content h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            text-shadow: 0 0 20px var(--text-glow);
            line-height: 1.3;
        }

        .content p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .highlight {
            color: #ea1203;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(234, 18, 3, 0.5);
        }

        /* 声明区块 */
        .statement-block {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 300px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            z-index: 90;
            cursor: move;
            user-select: none;
            transition: all 0.3s ease;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border: none;
            background: var(--secondary-gradient);
            color: white;
            font-size: 1.2rem;
            line-height: 1;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 92;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
        }

        .close-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.5);
            outline: none;
        }

        .statement-block p {
            margin-bottom: 8px;
            padding-right: 40px;
            color: var(--text-secondary);
        }

        .statement-block p:last-child {
            margin-bottom: 0;
        }

        /* 匀速移动文字样式 */
        .moving-text {
            position: absolute;
            background: var(--secondary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
            cursor: default;
            white-space: nowrap;
            z-index: 80;
            transition: left 2s linear, top 2s linear;
            text-shadow: 0 0 10px rgba(240, 147, 251, 0.5);
        }

        /* 手机访问提示 */
        .mobile-tip {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            color: var(--text-secondary);
            text-align: center;
            padding: 15px 20px;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 999;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .navbar {
                height: auto;
                min-height: 70px;
                padding: 15px 15px;
                flex-direction: column;
                gap: 10px;
            }

            .logo-container {
                gap: 10px;
            }

            .avatar {
                width: 40px;
                height: 40px;
            }

            .navbar .nickname {
                font-size: 1.4rem;
            }

            .nav-links {
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-links a {
                padding: 8px 14px;
                font-size: 0.85rem;
                white-space: nowrap;
            }

            .main-container {
                padding-top: 140px;
                padding-left: 15px;
                padding-right: 15px;
            }

            .content {
                padding: 25px 15px;
            }

            .content h1 {
                font-size: 1.8rem;
                text-align: center;
            }

            .content p {
                font-size: 0.95rem;
                text-align: left;
                line-height: 1.6;
            }

            .mobile-tip {
                display: block;
                font-size: 0.85rem;
            }

            .statement-block {
                max-width: 280px;
                font-size: 0.85rem;
                padding: 15px;
                bottom: 60px;
                right: 15px;
                left: 15px;
                margin: 0 auto;
            }

            .moving-text {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 12px 10px;
            }

            .navbar .nickname {
                font-size: 1.2rem;
            }

            .nav-links {
                gap: 6px;
            }

            .nav-links a {
                padding: 6px 10px;
                font-size: 0.8rem;
            }

            .main-container {
                padding-top: 130px;
            }

            .content h1 {
                font-size: 1.6rem;
            }

            .content p {
                font-size: 0.9rem;
            }

            .statement-block {
                max-width: 250px;
                font-size: 0.8rem;
                padding: 12px;
            }

            .moving-text {
                font-size: 1.2rem;
            }
        }

        /* 小屏幕设备额外优化 */
        @media (max-width: 360px) {
            .navbar .nickname {
                font-size: 1.1rem;
            }

            .nav-links a {
                font-size: 0.75rem;
                padding: 5px 8px;
            }

            .content h1 {
                font-size: 1.4rem;
            }

            .content p {
                font-size: 0.85rem;
            }

            .moving-text {
                font-size: 1rem;
            }
        }

        @media (min-width: 769px) {
            .moving-text {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar" id="navbar">
        <div class="logo-container">
            <img src="抖音头像.jpg" alt="跑杀2的头像" class="avatar">
            <a href="../index.html" class="nickname">愈兴.</a>
        </div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div class="nav-links">
                <a href="../index.html">首页</a>
                <a href="index.html" class="active">声明</a>
                <a href="../zq.html">节日祝福</a>
                <a href="https://v.douyin.com/xvmtN621cWQ/" target="_blank" class="douyin-link">抖音主页</a>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <div class="main-container">
        <div class="content">
            <h1>定制刀服务声明</h1>
            <p>本人做的定制刀基本是<span class="highlight">默认秋霜</span>(就是进游戏默认手里抓着那把)。<br>
                因为我师傅教我没收费，所以不管别人是怎么样，我做的刀皮均不收费。<br>
                心情好的话赏我个三瓜两枣，感谢您的支持！</p>
        </div>
    </div>

    <!-- 移动文字元素 -->
    <span class="moving-text">接定制🆓！</span>

    <!-- 可拖动声明区块 -->
    <div class="statement-block" id="statementBlock">
        <button class="close-btn" id="closeBtn">&times;</button>
        <p style="color: #f5576c; font-weight: 600;">本网站的所有内容均为个人创作，不涉及任何商业用途。</p>
        <p style="color: #f5576c; font-weight: 600;">本网站的所有内容均为个人创作，不涉及任何商业用途。</p>
        <p style="color: #f5576c; font-weight: 600;">本网站的所有内容均为个人创作，不涉及任何商业用途。</p>
    </div>

    <!-- 手机访问提示 -->
    <div class="mobile-tip">
        🖥️ 建议使用电脑访问，获得更完整的浏览体验
    </div>

    <script>
        // 主题切换功能
        const themeToggle = document.getElementById('themeToggle');
        const htmlBody = document.body;

        // 检查本地存储中的主题设置
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            htmlBody.classList.add('dark-mode');
            themeToggle.textContent = '☀️';
        }

        themeToggle.addEventListener('click', () => {
            const isDark = htmlBody.classList.toggle('dark-mode');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // 声明块关闭功能
        const closeBtn = document.getElementById('closeBtn');
        const statementBlock = document.getElementById('statementBlock');

        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            statementBlock.style.display = 'none';
        });

        closeBtn.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            e.preventDefault();
            statementBlock.style.display = 'none';
        }, { passive: false });

        // 声明块拖动功能
        let isDragging = false;
        let offsetX, offsetY;

        statementBlock.addEventListener('mousedown', (e) => {
            if (e.target !== closeBtn) {
                isDragging = true;
                offsetX = e.clientX - statementBlock.getBoundingClientRect().left;
                offsetY = e.clientY - statementBlock.getBoundingClientRect().top;
                statementBlock.style.cursor = 'grabbing';
            }
        });

        statementBlock.addEventListener('touchstart', (e) => {
            if (e.target !== closeBtn) {
                isDragging = true;
                const touch = e.touches[0];
                offsetX = touch.clientX - statementBlock.getBoundingClientRect().left;
                offsetY = touch.clientY - statementBlock.getBoundingClientRect().top;
                statementBlock.style.cursor = 'grabbing';
                e.preventDefault();
            }
        }, { passive: false });

        function handleDragMove(e) {
            if (!isDragging) return;

            let clientX, clientY;
            if (e.type === 'mousemove') {
                clientX = e.clientX;
                clientY = e.clientY;
            } else {
                const touch = e.touches[0];
                clientX = touch.clientX;
                clientY = touch.clientY;
            }

            const maxX = window.innerWidth - statementBlock.offsetWidth;
            const maxY = window.innerHeight - statementBlock.offsetHeight;
            const newX = Math.max(0, Math.min(clientX - offsetX, maxX));
            const newY = Math.max(0, Math.min(clientY - offsetY, maxY));

            statementBlock.style.left = `${newX}px`;
            statementBlock.style.top = `${newY}px`;
            statementBlock.style.right = 'auto';
            statementBlock.style.bottom = 'auto';
        }

        document.addEventListener('mousemove', handleDragMove);
        document.addEventListener('touchmove', handleDragMove, { passive: false });

        function endDrag() {
            isDragging = false;
            statementBlock.style.cursor = 'move';
        }

        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);

        // 匀速移动文字功能 - 优化版
        const movingText = document.querySelector('.moving-text');
        const navbar = document.getElementById('navbar');

        // 初始化文字大小
        function initTextSize() {
            movingText.style.fontSize = window.innerWidth <= 768 ? '1.5rem' : '2rem';
        }

        // 生成随机目标位置（优化边界计算，避免文字出界）
        function getRandomTargetPosition() {
            // 先确保获取到最新的文字尺寸
            movingText.style.visibility = 'hidden'; // 临时隐藏避免闪烁
            const textRect = movingText.getBoundingClientRect();
            movingText.style.visibility = 'visible';

            const textWidth = textRect.width;
            const textHeight = textRect.height;
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const navbarHeight = navbar.offsetHeight;

            // 安全边界：上下左右各留10px间距
            const maxX = windowWidth - textWidth - 10;
            const maxY = windowHeight - textHeight - 10;
            const minY = navbarHeight + 10;
            const minX = 10;

            // 生成随机位置（确保在安全区域内）
            const randomX = Math.floor(Math.random() * (maxX - minX)) + minX;
            const randomY = Math.floor(Math.random() * (maxY - minY)) + minY;

            return { left: randomX, top: randomY };
        }

        // 优化动画循环逻辑 - 监听过渡结束事件，避免时间差导致卡顿
        function moveToRandomPosition() {
            const targetPosition = getRandomTargetPosition();

            // 应用目标位置
            movingText.style.left = `${targetPosition.left}px`;
            movingText.style.top = `${targetPosition.top}px`;
        }

        // 监听过渡结束事件，无缝衔接下一次移动
        movingText.addEventListener('transitionend', () => {
            // 延迟0ms立即触发下一次移动，实现无缝循环
            requestAnimationFrame(moveToRandomPosition);
        });

        // 窗口大小变化时重新适配
        window.addEventListener('resize', () => {
            initTextSize();
            // 立即调整位置，避免窗口变化后文字出界
            const targetPosition = getRandomTargetPosition();
            // 临时关闭过渡，避免窗口缩放时的动画卡顿
            movingText.style.transition = 'none';
            movingText.style.left = `${targetPosition.left}px`;
            movingText.style.top = `${targetPosition.top}px`;
            // 恢复过渡
            setTimeout(() => {
                movingText.style.transition = 'left 2s linear, top 2s linear';
            }, 50);
        });

        // 页面加载后初始化并启动动画
        window.addEventListener('load', () => {
            initTextSize();
            // 初始位置设置
            const initialPosition = getRandomTargetPosition();
            movingText.style.left = `${initialPosition.left}px`;
            movingText.style.top = `${initialPosition.top}px`;

            // 启动第一次动画（延迟2秒，与过渡时间一致）
            setTimeout(moveToRandomPosition, 2000);
        });
    </script>
</body>

</html>
